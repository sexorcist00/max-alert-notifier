name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish as a release, e.g. 1.0.0. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Tests and APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Name the APK after the version
        id: apk
        run: |
          input_version="${{ inputs.version }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$input_version" ]; then
            tag="v${input_version}"
          else
            tag=""
          fi
          version="${tag#v}"
          [ -n "$version" ] || version="dev-${GITHUB_SHA::7}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "max-alert-${version}.apk"
          echo "path=max-alert-${version}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: max-alert-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish the release
        if: steps.apk.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
