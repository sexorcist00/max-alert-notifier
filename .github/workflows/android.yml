name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish as a release, e.g. 1.0.0. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Work out the version being built
        id: version
        run: |
          input_version="${{ inputs.version }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$input_version" ]; then
            tag="v${input_version}"
          else
            tag=""
          fi
          version="${tag#v}"
          # A build that is not a release calls itself 0.0.0: older than anything published,
          # so it never claims to be up to date.
          [ -n "$version" ] || version="0.0.0"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Tests and APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug -PappVersion=${{ steps.version.outputs.version }}

      - name: Name the APK after the version
        id: apk
        run: |
          version="${{ steps.version.outputs.version }}"
          name="alert-${version}.apk"
          [ -n "${{ steps.version.outputs.tag }}" ] || name="alert-dev-${GITHUB_SHA::7}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"
          echo "tag=${{ steps.version.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: max-alert-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish the release
        if: steps.apk.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: ${{ steps.apk.outputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
